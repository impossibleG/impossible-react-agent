name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: tar -czf impossible-react-agent-${GITHUB_REF_NAME}.tar.gz dist package.json README.md LICENSE THIRD_PARTY_NOTICES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: impossible-react-agent-${{ github.ref_name }}.tar.gz
